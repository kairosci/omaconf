[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter directory or choose/open file"

[[mgr.prepend_keymap]]
on = "<C-c>"
run = "yank"
desc = "Copy selected files"

[[mgr.prepend_keymap]]
on = "<C-x>"
run = "yank --cut"
desc = "Cut selected files"

[[mgr.prepend_keymap]]
on = "<C-v>"
run = "paste"
desc = "Paste files"

[[mgr.prepend_keymap]]
on = "<C-q>"
run = "quit"
desc = "Quit Yazi"

[[mgr.prepend_keymap]]
on = "<C-f>"
run = "filter --smart"
desc = "Search files"
