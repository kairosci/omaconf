[mgr]
linemode = "size"
show_hidden = false
show_symlink = true
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false

[preview]
wrap = "no"
tab_size = 2
max_width = 600
max_height = 900
image_delay = 100
image_filter = "triangle"
image_quality = 85

[opener]
# >>> omaconf obscure >>>
obscure-view = [ { run = "obscure-view %s", desc = "Unlock with obscure password", block = true, for = "unix" }, ]
edit = [
	{ run = '${EDITOR:-micro} %s', desc = "Edit with micro", block = true, for = "unix" },
]
reveal = [
	{ run = 'xdg-open %s', desc = "Open with system default", for = "linux" },
]
view = [
	{ run = 'zathura %s', desc = "View PDF with zathura", orphan = true, for = "unix" },
]
img = [
	{ run = 'imv %s', desc = "View image with imv", orphan = true, for = "unix" },
]
play = [
	{ run = 'mpv %s', desc = "Play with mpv", orphan = true, for = "unix" },
]
extract = [
	{ run = '7z x %s', desc = "Extract archive here", block = true, for = "unix" },
]

[open]
# >>> omaconf obscure >>>
prepend_rules = [
	{ url = "*2fa*", use = "obscure-view" },
	{ url = "*two*factor*", use = "obscure-view" },
	{ url = "*two-factor*", use = "obscure-view" },
	{ url = "*totp*", use = "obscure-view" },
	{ url = "*hotp*", use = "obscure-view" },
	{ url = "*authenticator*", use = "obscure-view" },
	{ url = "*backup*code*", use = "obscure-view" },
	{ url = "*recovery*code*", use = "obscure-view" },
	{ url = "*recovery*key*", use = "obscure-view" },
	{ url = "*backup*key*", use = "obscure-view" },
	{ url = "*passkey*", use = "obscure-view" },
	{ url = "*password*", use = "obscure-view" },
	{ url = "*secret*", use = "obscure-view" },
	{ url = "*credential*", use = "obscure-view" },
	{ url = "*seed*phrase*", use = "obscure-view" },
	{ url = "*mnemonic*", use = "obscure-view" },
	{ url = "*.pem", use = "obscure-view" },
	{ url = "*.key", use = "obscure-view" },
	{ url = "*.kdbx*", use = "obscure-view" },
]
# <<< omaconf obscure <<<
rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ mime = "application/pdf", use = "view" },
	{ mime = "image/*", use = "img" },
	{ mime = "video/*", use = "play" },
	{ mime = "audio/*", use = "play" },
	{ mime = "application/zip", use = "extract" },
	{ mime = "application/gzip", use = "extract" },
	{ mime = "application/x-tar", use = "extract" },
	{ mime = "application/x-bzip2", use = "extract" },
	{ mime = "application/x-xz", use = "extract" },
	{ mime = "application/x-7z-compressed", use = "extract" },
	{ url = "*.md", use = "edit" },
]
