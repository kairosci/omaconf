---
name: Shell SAST

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  semgrep:
    name: Bash security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install \
            --disable-pip-version-check \
            -r requirements-sast.txt
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      - name: Scan Bash sources
        run: |
          semgrep scan \
            --metrics off \
            --config p/bash \
            --sarif \
            --output semgrep.sarif \
            scripts hooks conf tests clean/scripts clean/scripts/modules \
            obscure/scripts obscure/scripts/modules ai/scripts ai/scripts/modules \
            performance/scripts performance/scripts/modules

      - name: Upload SARIF results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: >-
          github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: semgrep.sarif
