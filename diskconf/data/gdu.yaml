# Managed by omaconf diskconf. gdu reads $HOME/.config/gdu/gdu.yaml
# (see `gdu --write-config` for every option). The style: section is owned
# by hooks/theme-set.d/disk-theme and regenerated from the active Omarchy
# theme. Keybindings are vim-style natively, same as yazi: j/k move,
# g/G top/bottom, h/l parent/enter, d delete, s sort, ? opens help.
sorting:
    by: ""
    order: ""
log-file: /dev/null
input-file: ""
output-file: ""
output-attrs: ""
ignore-from-file: ""
ignore-dirs:
    - /proc
    - /dev
    - /sys
    - /run
ignore-dir-patterns: []
type: []
exclude-type: []
max-cores: 12
top: 0
depth: 0
sequential-scanning: false
show-apparent-size: false
show-relative-size: false
show-annexed-size: false
show-item-count: false
show-mtime: false
no-color: false
mouse: false
non-interactive: false
interactive: false
no-progress: false
no-unicode: false
no-cross: false
no-hidden: false
no-delete: false
no-view-file: false
no-spawn-shell: false
no-confirm-quit: false
follow-symlinks: false
profiling: false
read-from-storage: false
db: ""
summarize: false
use-si-prefix: false
no-prefix: false
show-in-kib: false
reverse-sort: false
change-cwd: false
delete-in-background: false
delete-in-parallel: false
since: ""
until: ""
max-age: ""
min-age: ""
archive-browsing: false
collapse-path: false
show-symlink-target: false
browse-parent-dirs: false
web:
    listen: ""
    open-browser: true
    browser: ""
