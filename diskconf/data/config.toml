# Managed by omaconf diskconf. dua (Disk Usage Analyzer) reads this file from
# $XDG_CONFIG_HOME/dua-cli/config.toml. Unknown keys are ignored by dua and
# missing keys fall back to dua defaults, so only keys documented by
# `dua config show-default` are set here. Keybindings mirror the vim-style
# navigation shared by yazi, zathura and micro: j/k move, g/G jump to
# top/bottom, h/l change directory, Tab cycles panes, / searches,
# ? opens help, q quits. Theme: dua inherits the terminal palette, so it
# follows the active Omarchy theme automatically with no color keys to
# force. The active theme slug and its palette are recorded in the managed
# header maintained by hooks/theme-set.d/disk-theme.

format = "binary"
gitignore = true
cleanup_heuristics = true

[keys]
esc_navigates_back = true
close_pane = "esc"
quit = "q"
quit_immediately = "ctrl+c"
suspend = "ctrl+z"
cycle_panes = "tab"
toggle_help = "?"
open_search = "/"
move_down = ["j", "down"]
move_up = ["k", "up"]
page_down = ["ctrl+d", "page-down"]
page_up = ["ctrl+u", "page-up"]
move_to_top = ["g", "H", "home"]
move_to_bottom = ["G", "end"]
descend = ["o", "l", "enter", "right"]
ascend = ["u", "h", "backspace", "left"]
scan_parent = "U"
sort_by_size = "s"
sort_by_mtime = "m"
cycle_mtime_mode = "M"
sort_by_count = "c"
toggle_count_column = "C"
sort_by_name = "ctrl+n"
cycle_visualization = ["S"]
open_entry = "O"
toggle_mark = "space"
mark_for_deletion = "x"
toggle_mark_and_move_down = "d"
toggle_all = "a"
toggle_cleanup = "t"
mark_cleanup = "X"
toggle_gitignore = "i"
mark_gitignore = "I"
refresh_selected = "r"
refresh_all = "R"
remove_mark = ["x", "d", "space"]
remove_all_marks = "a"
delete_marked = "ctrl+r"
trash_marked = "ctrl+t"
search_confirm = "enter"
search_toggle_case = "ctrl+f"
search_backspace = "backspace"
search_left = "left"
search_right = "right"

[notifications]
scan_finished = true
delete_finished = true
